# Perch config. Raven does not read this file.
# Default location: ~/.config/perch/config.toml
#
# Each type (and each saved query) has an ordered list of named layouts.
# The first is the default. L / gL cycle only this list; gl or space l opens
# the layout picker; 1-9 jump to layout N.
#
# kind: list | board | date
# date takes group_by and granularity (day/week/month). . cycles granularity
# inside a date layout and does not invent extra group-by fields.
# Optional filter is an RQL predicate appended to the type source.
# Type and field names here are yours; Perch does not treat any of them
# as special.
#
# Zero-config (when a type has no [[layouts]]):
#   1. List always (the default)
#   2. Board if the type has a scalar enum, grouped by the first such
#      field in schema definition order
#   3. Date if the type has a scalar date/datetime field, grouped by the
#      first such field in schema definition order (granularity day)

[[types.item.layouts]]
name = "Board"
kind = "board"
group_by = "state"
fields = ["state", "when"]

[[types.item.layouts]]
name = "By when"
kind = "list"
fields = ["state", "when"]
sort = "when"

[[types.item.layouts]]
name = "Open"
kind = "list"
filter = ".state==open"
fields = ["state", "when"]

[[queries.inbox.layouts]]
name = "Inbox"
kind = "list"
sort = "label"
