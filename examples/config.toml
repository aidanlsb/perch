# Perch config. Raven does not read this file.
# Default location: ~/.config/perch/config.toml
#
# Names below (item, task, state, when, inbox, …) are examples. They are not
# reserved. Perch does not assume a vault schema.
#
# A view is exactly one of type (a schema type name) or query (a Raven saved
# query name), plus one list/board/date presentation. Inline RQL is not
# allowed here; use `:` in the TUI for ad-hoc queries.
# {{selected}} is filled from the panel named in bind.
#
# A layout is a nested split of panels. A leaf is a named view, or a type
# or saved query inline (optional inputs, kind/group_by/fields, and
# id/name for bind). split is row (side by side) or col (stacked).
# A view opens on its own as a one-panel layout; you do not need a
# [layouts.*] table just to look at a [views.*].
#
# Space t lists every schema type as a plain list. Board and date
# presentations are only those you declare here. Bare `perch` opens the
# first layout in this file (Home sits under it in history); with no
# layouts, the first view; with neither, the Home dashboard. `perch <name>`
# opens home, a view, layout, saved query, or type. Space v / Space l
# lists views and layouts. Space h / gh jump to Home.

[views.projects]
type = "item"
kind = "board"
group_by = "state"
fields = ["state", "when"]

[views.by-when]
type = "item"
kind = "list"
fields = ["state", "when"]
sort = "when"

[views.open]
type = "item"
kind = "list"
filter = ".state==open"
fields = ["state", "when"]

[views.week]
type = "event"
kind = "date"
group_by = "when"
granularity = "week"

[views.inbox]
query = "inbox"
kind = "list"
sort = "label"

[views.tasks]
type = "task"
inputs = { item = "{{selected}}" }
kind = "list"
fields = ["state"]

[layouts.workspace]
split = "row"
panels = [
  { view = "projects" },
  { split = "col", panels = [
      { view = "tasks", bind = "projects" },
      { view = "inbox" },
  ] },
]

# Layout panels can also sit on a type or saved query directly.
[layouts.direct]
split = "row"
panels = [
  { type = "item", id = "projects", kind = "board", group_by = "state", fields = ["state", "when"] },
  { type = "task", bind = "projects", inputs = { item = "{{selected}}" }, kind = "list", fields = ["state"] },
  { query = "inbox", kind = "list", sort = "label" },
]
